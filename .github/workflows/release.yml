name: release

# Builds lite-harness / lite-harnessd release binaries and attaches them to
# a GitHub Release. Windows is out of scope for v1 (see docs/architecture)
# so only Linux and macOS are built.
#
# Two ways in:
#   - `push: tags: v*.*.*` -- a human (or any token that isn't the default
#     GITHUB_TOKEN) pushes a version tag directly.
#   - `workflow_call` -- invoked by tag-on-merge.yml right after it creates
#     the tag. This exists because a workflow that pushes a tag using the
#     default GITHUB_TOKEN does NOT trigger other workflows' `push: tags`
#     events (a deliberate GitHub Actions anti-recursion rule) -- calling
#     this workflow directly, in the same run, sidesteps that instead of
#     needing a separate PAT/secret just to make one tag push trigger
#     another workflow.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      version:
        description: "Version tag to build and release (e.g. v0.0.2) -- required when called via workflow_call, since that context doesn't set GITHUB_REF_NAME to the tag the way a real tag-push event does."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p lh-cli -p lh-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version || github.ref_name }}"
          stage="lite-harness-${version}-${{ matrix.name }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/lite-harness" "$stage/"
          cp "target/${{ matrix.target }}/release/lite-harnessd" "$stage/"
          tar czf "${stage}.tar.gz" "$stage"
          shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: lite-harness-${{ matrix.name }}
          path: |
            lite-harness-*.tar.gz
            lite-harness-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: dist/*
          generate_release_notes: true
