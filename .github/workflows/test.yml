name: test

# Reusable: the actual build+test gate, called by both `ci.yml` (so every
# push/PR gets a status check) and `tag-on-merge.yml` (so a broken commit
# on main can never be auto-tagged and released -- see that workflow's own
# comment). Kept as its own file rather than duplicated in both callers.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Both platforms release.yml already ships binaries for. lh-execution's
    # sandbox backend is platform-gated (Landlock on Linux, Seatbelt on
    # macOS, cfg(target_os) in crates/lh-execution/src/sandbox.rs) -- a
    # Linux-only test run would never compile or exercise the macOS half at
    # all, even though release.yml has been building it unverified this
    # whole time.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace (including tests)
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

  clippy:
    # Informational only (no -D warnings): the workspace currently carries
    # a handful of pre-existing clippy warnings (type_complexity,
    # too_many_arguments, cmp_owned) that haven't been cleaned up yet.
    # Surfacing them here without failing the build avoids blocking every
    # future push on an unrelated backlog; tighten to `-D warnings` once
    # that backlog is cleared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (report only)
        run: cargo clippy --workspace --all-targets

  coverage:
    # Blocking, unlike clippy above: line coverage was brought from 71.61%
    # to 96%+ workspace-wide, and this is what keeps it there -- a change
    # that drops coverage below the floor fails the build rather than
    # silently eroding it commit by commit. Ubuntu-only (coverage doesn't
    # need the cross-platform matrix `test` above has; this crate's
    # sandbox backend is platform-gated but exercised on whichever OS this
    # job runs on either way).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce line coverage floor
        # sandbox/{linux,macos}.rs are excluded: both are best-effort
        # kernel-capability probes (Landlock / Seatbelt) that gracefully
        # no-op on a host without support, by design (see their own doc
        # comments) -- their own line coverage swings with whatever the
        # runner's kernel happens to support, not with test quality.
        # Confirmed live: identical, unchanged code measured ~90% locally
        # (Landlock available) and ~45% on this job's runner (not
        # available) in the same CI run that added lh-tui -- a ~40-line
        # swing in one 88-line file that alone moved the workspace total
        # across the 95% line with zero code changes to explain it.
        run: cargo llvm-cov --workspace --fail-under-lines 95 --ignore-filename-regex 'sandbox/(linux|macos)\.rs'
