[workspace]
resolver = "2"
members = [
    "crates/lh-event",
    "crates/lh-store",
    "crates/lh-protocol",
    "crates/lh-model-provider",
    "crates/lh-permission",
    "crates/lh-native-agent",
    "crates/lh-daemon",
    "crates/lh-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "1"
anyhow = "1"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
wiremock = "0.6"
tempfile = "3"
